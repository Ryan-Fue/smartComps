<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>smartComps | Valuation Interface</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='assets/BFB_logo.png') }}">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="interface-container">
        <!-- Banner -->
        <div class="mb-5">
            <img src="{{ url_for('static', filename='assets/BFB_banner.png') }}" alt="Bruins in Finance and Banking" style="max-width: 400px; height: auto;">
        </div>

        <!-- Brand Label -->
        <div class="valuator-label">smartComps Valuator</div>
        
        <!-- Header Section -->
        <h1 class="main-title serif">Valuation Interface <span style="font-size: 2rem; vertical-align: middle; color: #1e3a8a; cursor: help;">&#9432;</span></h1>

        <!-- Step 1: Model Setup (Collapsible Configuration) -->
        <div class="accordion mb-5" id="setupAccordion">
            <div class="accordion-item border-0">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed bg-light rounded-3" type="button" data-bs-toggle="collapse" data-bs-target="#collapseConfig">
                        <span class="valuator-label">Engine Setup & Training</span>
                    </button>
                </h2>
                <div id="collapseConfig" class="accordion-collapse collapse" data-bs-parent="#setupAccordion">
                    <div class="accordion-body config-section">
                        <div class="row">
                            <div class="col-md-7">
                                <label class="form-label">Select Input Features</label>
                                <div id="config-container" class="d-flex flex-wrap gap-3">
                                    <!-- Populated by JS -->
                                </div>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label">Target Variable</label>
                                <select id="target-select" class="form-select mb-4">
                                    <!-- Populated by JS -->
                                </select>
                                <button id="train-btn" class="btn btn-dark w-100">Initialize & Train Engine</button>
                                <div id="train-status" class="mt-2 small text-muted"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Step 2: Main Valuation Interface -->
        <div id="main-interface" class="mt-5">
            <div class="row g-5">
                <!-- Select Engine -->
                <div class="col-md-6">
                    <div class="form-group-custom">
                        <label class="form-label">Select Engine Model</label>
                        <select class="form-select">
                            <option>Mid-Market Valuation Engine</option>
                            <option disabled>Mega-Cap Valuation Engine (Coming Soon)</option>
                        </select>
                    </div>
                </div>

                <!-- Desired Outputs (Mocked pills) -->
                <div class="col-md-6">
                    <div class="form-group-custom">
                        <label class="form-label">Desired Output</label>
                        <div class="pill-container" id="target-display">
                            <span class="output-pill">Enterprise Value <small>&times;</small></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Financial Metrics Grid -->
            <div id="prediction-inputs" class="row g-4 mt-2">
                <!-- Dynamically generated inputs will go here -->
                <div class="col-12 text-muted text-start small">
                    <p>Metrics will appear here once the engine is initialized.</p>
                </div>
            </div>

            <!-- Business Summary -->
            <div class="row mt-4">
                <div class="col-12">
                    <div class="form-group-custom">
                        <textarea class="form-control" id="business_summary" rows="4" placeholder="Paste Business Summary / Qualitative Strategy Overview..."></textarea>
                    </div>
                </div>
            </div>

            <!-- Generate Button -->
            <button id="predict-btn" class="btn btn-generate" disabled>Generate Valuation Report</button>
            
            <!-- Result Display -->
            <div id="prediction-result" class="mt-5 serif display-4 d-none">
                <!-- Valuation Result -->
            </div>

            <div class="footer-note">
                Quantitative predictions are generated via the smartComps hybrid regression pipeline.
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
